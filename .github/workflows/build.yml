
name: Build InventoryOwnSounds

on:
  push:
    paths:
      - 'InventoryOwnSounds-Fabric-1.21.11-source.zip'
      - '.github/workflows/build.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Extract source project
        run: unzip -o InventoryOwnSounds-Fabric-1.21.11-source.zip -d source

      - name: Build mod
        run: gradle -p source/InventoryOwnSounds-Fabric-1.21.11 build

      - name: Upload JAR
        uses: actions/upload-artifact@v4
        with:
          name: inventory-own-sounds-jar
          path: source/InventoryOwnSounds-Fabric-1.21.11/build/libs/*.jar
