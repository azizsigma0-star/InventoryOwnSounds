
name: Build InventoryOwnSounds

on:
  push:
    paths:
      - 'InventoryOwnSounds-Fabric-1.21.11-source.zip'
      - '.github/workflows/build.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Extract source project
        run: unzip -o InventoryOwnSounds-Fabric-1.21.11-source.zip -d source

      
      - name: Fix Minecraft identifier class
        run: |
          FILE="source/InventoryOwnSounds-Fabric-1.21.11/src/main/java/dev/aziz/inventoryownsounds/ModSounds.java"
          sed -i 's/import net.minecraft.resources.ResourceLocation;/import net.minecraft.resources.Identifier;/' "$FILE"
          sed -i 's/ResourceLocation/Identifier/g' "$FILE"
      - name: Fix Gradle repositories
        run: |
          cat > source/InventoryOwnSounds-Fabric-1.21.11/settings.gradle <<'EOF'
          pluginManagement {
              repositories {
                  maven { url = 'https://maven.fabricmc.net/' }
                  gradlePluginPortal()
                  mavenCentral()
              }
          }
          rootProject.name = 'InventoryOwnSounds'
          EOF
      - name: Build mod
        run: gradle -p source/InventoryOwnSounds-Fabric-1.21.11 build
      - name: Check Mixin class in JAR
        run: |
          JAR=$(find source/InventoryOwnSounds-Fabric-1.21.11/build/libs -name 'inventory-own-sounds-1.0.0.jar' | head -n 1)
          echo "Checking JAR: $JAR"
          jar tf "$JAR" | grep -E 'MinecraftScreenMixin|inventoryownsounds.mixins.json' || true
      - name: Upload JAR
        uses: actions/upload-artifact@v4
        with:
          name: inventory-own-sounds-jar
          path: source/InventoryOwnSounds-Fabric-1.21.11/build/libs/*.jar
